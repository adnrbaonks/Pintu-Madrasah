# Infrastruktur staging PINTU MADRASAH: MySQL 8 + Redis 7.
#
# Pemakaian:
#   cp .env.staging.example .env.staging
#   docker compose -f docker-compose.staging.yml up -d
#
# Aplikasi Laravel tetap dijalankan di host/aaPanel. Bila port 3306/6379
# sudah dipakai, set MYSQL_PORT atau REDIS_PORT sebelum compose up.
# File ini hanya untuk staging, bukan production.

name: pintu-staging-infra

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pintu_madrasah_staging}
      MYSQL_USER: ${MYSQL_USER:-pintu_staging}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - pintu-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - pintu-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pintu-mysql-data:
  pintu-redis-data:
